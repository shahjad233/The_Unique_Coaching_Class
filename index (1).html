<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Unique Coaching Classes – Mau Sahaniya</title>
<meta name="description" content="Physics, Mathematics, Chemistry and English coaching, classes 9 to 12. Jaidev Palace, Bus Stand, Mau Sahaniya.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Hind:wght@400;500;600&family=Marcellus&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>:root{--m:#6E1416;--md:#3F0A0C;--g:#E3A21A;--ink:#211618;--mu:#6A5D5F;--bg:#FBF9F9;--ln:#E7DEDF;--w:#fff}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Hind',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;font-size:17px;overflow-x:hidden}
h1,h2,h3,.brand,.big,.stats strong{font-family:'Bricolage Grotesque','Hind',system-ui,sans-serif;line-height:1.12}
a{color:inherit}a,button{cursor:pointer}:focus-visible{outline:3px solid var(--g);outline-offset:3px}
.wrap{max-width:1120px;margin:auto;padding:0 22px}
.nav{position:sticky;top:0;z-index:10;background:rgba(63,10,12,.92);backdrop-filter:blur(10px);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:800;text-decoration:none;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--md);display:grid;place-items:center;font-weight:800}
.nav nav{display:flex;align-items:center;gap:22px;font-size:.95rem}.nav nav a{text-decoration:none;opacity:.85}.nav nav a:hover{opacity:1}
.pill{background:var(--g);color:var(--md);padding:8px 18px;border-radius:99px;font-weight:600;opacity:1!important}
.prog{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--g);transform-origin:0 50%}
.hero{background:radial-gradient(900px 500px at 85% 10%,#8f1d20 0,transparent 60%),var(--m);color:#fff;padding-top:56px;overflow:hidden}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:end}
.tag{color:var(--g);font-weight:600;letter-spacing:.06em;margin-bottom:14px}
h1{font-size:clamp(2.3rem,5.4vw,4rem);font-weight:800;letter-spacing:-.02em}
.ov{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.lead{margin:20px 0 28px;max-width:32em;color:#F1DADA;font-size:1.1rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:56px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:10px;font-weight:600;text-decoration:none;min-height:48px}
.gold{background:var(--g);color:var(--md)}.line{border:2px solid rgba(255,255,255,.5);color:#fff}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.faces figure{position:relative;border-radius:18px 18px 0 0;overflow:hidden;background:#222}
.faces img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;display:block}
.faces figcaption{position:absolute;inset:auto 0 0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(30,4,6,.9));display:flex;flex-direction:column;font-size:.85rem}
.faces figcaption b{font-size:1rem}.faces figcaption span{color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.15);padding-top:22px;padding-bottom:22px;margin-top:0}
.stats div{display:flex;flex-direction:column}.stats strong{font-size:2rem;color:var(--g)}.stats span{color:#E9CFCF;font-size:.9rem}
section{padding:88px 0}.alt{background:var(--w);border-block:1px solid var(--ln)}
h2{font-size:clamp(1.8rem,3.8vw,2.6rem);font-weight:800;color:var(--m);margin-bottom:8px}
.sub{color:var(--mu);margin-bottom:38px;display:flex;align-items:center;gap:8px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.scard,.card,.tcard{background:var(--w);border:1px solid var(--ln);border-radius:16px}
.scard{padding:26px 22px;transition:box-shadow .3s}.scard:hover{box-shadow:0 18px 40px -18px rgba(110,20,22,.35)}
.ico{width:46px;height:46px;border-radius:12px;background:#F8E9E9;color:var(--m);display:grid;place-items:center;margin-bottom:16px}
.scard h3,.card h3{font-size:1.3rem;margin-bottom:6px}.scard p{color:var(--mu);font-size:.95rem}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tcard{display:grid;grid-template-columns:220px 1fr;overflow:hidden;transition:box-shadow .3s}.tcard:hover{box-shadow:0 22px 50px -22px rgba(110,20,22,.4)}
.timg{overflow:hidden;background:#222}.timg img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;min-height:260px}
.tbody{padding:26px;display:flex;flex-direction:column;justify-content:center;gap:14px}.tbody h3{font-size:1.5rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{background:#F8E9E9;color:var(--m);font-weight:600;font-size:.88rem;padding:4px 12px;border-radius:99px}
.tbody a{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--m);text-decoration:none;min-height:44px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{padding:30px}
.big{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;margin:6px 0 10px}.big small{font-size:.95rem;font-weight:500;color:var(--mu);font-family:'Hind',sans-serif}
.feecard ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}.feecard li{display:flex;gap:10px;align-items:center;color:var(--mu)}.feecard li svg{color:var(--m);flex:none}
.tog{display:inline-flex;background:#F3ECEC;border-radius:99px;padding:4px;margin-bottom:14px}
.tog button{position:relative;border:0;background:none;padding:9px 22px;border-radius:99px;font:600 .95rem 'Hind',sans-serif;color:var(--ink);min-height:44px}
.tog button[aria-selected=true]{color:#fff}.tog span{position:relative;z-index:1}.pl{position:absolute!important;inset:0;background:var(--m);border-radius:99px;z-index:0!important}
.dark{background:var(--md);color:#fff}.dark h2{color:#fff}.dark .sub{color:#E9CFCF}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cbox{display:block;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:22px;text-decoration:none;background:rgba(255,255,255,.04);transition:border-color .3s,background .3s}
.cbox:hover{border-color:var(--g);background:rgba(255,255,255,.08)}.cbox span{display:block;color:#E9CFCF;font-size:.92rem}.cbox b{font-size:1.2rem;color:var(--g);word-break:break-word}
footer{background:#2A0708;color:#CDB0B1;text-align:center;padding:22px;font-size:.9rem}
@media(max-width:900px){.hgrid,.tgrid,.fgrid,.cgrid{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr;gap:16px}.nav nav a:not(.pill){display:none}.btns{padding-bottom:28px}section{padding:64px 0}}
@media(max-width:520px){.sgrid{grid-template-columns:1fr}.tcard{grid-template-columns:130px 1fr}.tbody{padding:16px}.timg img{min-height:0}}
/* Afterglow-inspired theme: warm grey, black, pistachio, serif */
:root{--m:#111;--md:#111;--g:#5F6B2A;--bg:#ECEBE7;--ln:#CFCDC8;--mu:#57534E;--pist:#D6DE9C}
body{background:var(--bg)}
h1,h2,h3,.brand,.big,.stats strong{font-family:'Marcellus','Tiro Devanagari Hindi',Georgia,serif;font-weight:400}
h1,h2{text-transform:uppercase;letter-spacing:.02em}
h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.1}h2{font-size:clamp(1.7rem,3.6vw,2.4rem)}
.tag,.sub em{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',serif;font-style:italic;font-size:1.35rem;letter-spacing:0;color:var(--g)}
.nav{background:rgba(236,235,231,.92);color:#111;border-bottom:1px solid var(--ln)}
.brand{text-transform:uppercase;letter-spacing:.14em;font-size:.95rem}
.mark{background:#111;color:#fff;font-family:'Marcellus',serif}
.nav nav a{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}
.pill{background:#111;color:#fff;border-radius:0;padding:9px 20px}
.prog{background:var(--g)}
.hero{background:linear-gradient(180deg,#CBCAC5 0,#E6E5E1 100%);color:#111}
.lead{color:#3D3A36}
.btn{border-radius:0;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem}
.gold{background:#111;color:#fff}.line{border:1.5px solid #111;color:#111}
.faces figure{border-radius:0;box-shadow:0 30px 50px -30px rgba(0,0,0,.5)}.faces figcaption span{color:var(--pist)}
.stats{border-top:1px solid rgba(0,0,0,.2)}.stats strong{color:#111}.stats span{color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}
.alt{background:#F5F4F1}
.scard,.card,.tcard{border-radius:0;background:#F7F6F3}.alt .tcard{background:#fff}
.scard:hover,.tcard:hover{box-shadow:0 22px 44px -24px rgba(0,0,0,.35)}
.ico{background:#E2E4D3;color:#111;border-radius:0}.chips span{background:#E2E4D3;color:#111;border-radius:0}
.tbody a{color:#111}.feecard li svg{color:var(--g)}
.tog{background:#DDDBD6;border-radius:0}.tog button{border-radius:0;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}.pl{border-radius:0!important}
.dark{background:#111}.cbox{border-radius:0}.cbox b{color:var(--pist)}.cbox:hover{border-color:var(--pist)}
footer{background:#0A0A0A}
.lang{display:inline-flex;border:1.5px solid #111}
.lang button{position:relative;border:0;background:none;padding:6px 12px;font:600 .8rem 'Hind',sans-serif;color:#111;min-height:38px}
.lang button[aria-pressed=true]{color:#fff}.lang span{position:relative;z-index:1}.lgp{position:absolute!important;inset:0;background:#111;z-index:0!important}
@media(max-width:520px){.brand{font-size:.72rem;letter-spacing:.08em;gap:8px}.mark{width:28px;height:28px}.pill{display:none}.nav nav{gap:8px}.lang button{padding:6px 9px}}
.slider{background:#111;color:#fff;padding:34px 0 22px}
.slider h2{color:#fff;margin:6px 0 20px}
.sl-row{display:grid;grid-template-columns:54px 1fr 54px;gap:16px;align-items:center}
.sl-arrow{width:54px;height:54px;border:1.5px solid rgba(255,255,255,.45);background:none;color:#fff;display:grid;place-items:center;transition:background .25s,color .25s}
.sl-arrow:hover{background:#fff;color:#111}
.sl-stage{overflow:hidden;min-height:220px;display:grid;align-items:center;outline-offset:4px}
.sl-slide{text-align:center;cursor:grab;padding:8px 0}.sl-slide:active{cursor:grabbing}
.sl-k{font-family:'Cormorant Garamond','Tiro Devanagari Hindi',serif;font-style:italic;font-size:1.3rem;color:var(--pist)}
.sl-subs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.sl-chip{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.35);padding:12px 20px;font-weight:600;letter-spacing:.04em}
.sl-chip svg{color:var(--pist)}
.sl-dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.sl-dots button{background:none;border:0;padding:16px 8px}.sl-dots span{display:block;width:26px;height:3px;background:rgba(255,255,255,.3);transition:background .3s}
.sl-dots button[aria-current=true] span{background:var(--pist)}
@media(max-width:600px){.sl-row{grid-template-columns:44px 1fr 44px;gap:8px}.sl-arrow{width:44px;height:44px}.sl-chip{padding:10px 14px;font-size:.92rem}.sl-stage{min-height:250px}}
